<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工作区</title>
<style>
  :root { color-scheme: dark; --bg:#1e1f22; --bg2:#252629; --line:#333438; --fg:#d4d4d4; --dim:#8b8f98; --acc:#2e7cf6; --add:#6ecf97; --mod:#e2c08d; --del:#e07a7a; --un:#a6c98a; }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; }
  body { display: flex; font: 12px/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; }
  /* 面板内容区（左） + 拖拽条 + Activity Bar（右，贴窗口缘） */
  #panel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  #dragbar { flex: 0 0 5px; cursor: col-resize; background: var(--bg); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  #dragbar:hover { background: var(--acc); opacity: .4; }
  #bar { flex: 0 0 44px; background: var(--bg2); border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 2px; }
  .tab { width: 36px; height: 36px; border: none; background: none; color: var(--dim); font-size: 17px; border-radius: 6px; cursor: pointer; position: relative; }
  .tab:hover { color: var(--fg); }
  .tab.active { color: #fff; background: #33353b; }
  .tab.active::before { content: ""; position: absolute; right: -4px; top: 8px; bottom: 8px; width: 2px; background: var(--acc); border-radius: 1px; }
  .tab .badge { position: absolute; right: 2px; bottom: 2px; background: var(--acc); color: #fff; font-size: 9px; min-width: 14px; border-radius: 7px; padding: 0 3px; line-height: 14px; }
  .hidden { display: none !important; }
  #panel.collapsed #panel-body { display: none; }
  #panel.collapsed #panel-head { display: none; }

  #panel-head { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; min-height: 34px; }
  #panel-head .title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #panel-head .btn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 4px; }
  #panel-head .btn:hover { color: var(--fg); background: #ffffff12; }
  #panel-body { flex: 1; overflow: auto; padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 5px; padding: 2.5px 10px; cursor: pointer; white-space: nowrap; }
  .row:hover { background: #ffffff0d; }
  .row .name { overflow: hidden; text-overflow: ellipsis; }
  .caret { width: 12px; color: var(--dim); font-size: 9px; flex: 0 0 12px; text-align: center; }
  .icon { flex: 0 0 auto; }
  .gitmark { font-weight: 700; margin-left: auto; padding-left: 6px; }
  .gitmark.M { color: var(--mod); } .gitmark.U { color: var(--add); } .gitmark.A { color: var(--add); }
  .gitmark.D { color: var(--del); } .gitmark.R { color: var(--mod); } .gitmark.C { color: var(--add); }
  .indent0 { padding-left: 10px; } .indent1 { padding-left: 24px; } .indent2 { padding-left: 38px; }
  .indent3 { padding-left: 52px; } .indent4 { padding-left: 66px; } .indent5 { padding-left: 80px; } .indent6 { padding-left: 94px; }
  .msg { color: var(--dim); padding: 8px 10px; }
  .err { color: var(--del); padding: 8px 10px; word-break: break-all; }

  /* 搜索面板 */
  #search-box { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  #search-input { flex: 1; background: #141518; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 5px 8px; font: inherit; outline: none; }
  #search-input:focus { border-color: var(--acc); }
  #case-btn, #word-btn, .viewtoggle { border: 1px solid var(--line); background: none; color: var(--dim); border-radius: 6px; width: 30px; font-weight: 700; cursor: pointer; flex: none; }
  #case-btn.on, #word-btn.on, .viewtoggle.active { color: #fff; background: var(--acc); border-color: var(--acc); }
  svg.anticon { width: 14px; height: 14px; fill: currentColor; vertical-align: -2px; }
  .tab svg.anticon { width: 16px; height: 16px; }
  .tw svg.anticon { width: 10px; height: 10px; }
  .caret svg.anticon { width: 10px; height: 10px; }
  .path-hit svg.anticon, .filegroup-head svg.anticon, .tree-line svg.anticon { flex: none; }
  .path-hit { display: flex; gap: 6px; align-items: center; padding: 3px 10px; cursor: pointer; }
  .branch-head { display: flex; gap: 8px; align-items: center; padding: 4px 10px; cursor: pointer; }
  .branch-head:hover { background: #ffffff0d; }
  .branch-head .branch-name { display: flex; gap: 6px; align-items: center; font-weight: 600; }
  .branch-head .caret svg.anticon { width: 10px; height: 10px; }
  .branch-row { display: flex; gap: 6px; align-items: center; padding: 3px 10px 3px 22px; cursor: pointer; }
  .branch-row:hover { background: #ffffff0d; }
  .branch-row.current { color: var(--acc); font-weight: 600; }
  .newbranch-box { display: flex; gap: 6px; padding: 6px 10px; }
  .newbranch-box input { flex: 1; background: #141518; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 8px; font: inherit; outline: none; }
  .commit-item { padding: 4px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .commit-item:hover { background: #ffffff0d; }
  .commit-head { display: flex; gap: 8px; align-items: baseline; }
  .commit-head .cshort { font-family: ui-monospace, Menlo, monospace; color: #5a8bd8; flex: none; }
  .commit-head .csubj { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmeta { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .commit-files { padding: 2px 0 4px 14px; }
  .commit-file { display: flex; gap: 6px; padding: 2px 4px; cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 11px; border-radius: 4px; }
  .commit-file:hover { background: #ffffff0d; }
  .commit-file .st { color: #b8b8b8; width: 12px; flex: none; }
  .path-hit:hover { background: #ffffff0d; }
  .path-hit .pkind { color: var(--dim); font-size: 11px; }
  .tree-line { display: flex; align-items: center; gap: 5px; padding: 2px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .tree-line:hover { background: #ffffff0d; }
  .tree-line .tw { color: var(--dim); width: 10px; display: inline-block; }
  .tree-line .cnt { color: var(--dim); font-size: 11px; }
  .tree-match { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; padding: 1px 10px 1px 30px; cursor: pointer; white-space: nowrap; }
  .tree-match:hover { background: #ffffff0d; }
  .mark { background: #6d5a15; color: #ffe9a8; border-radius: 2px; }
  .filegroup-head { display: flex; gap: 5px; align-items: center; padding: 3px 10px; font-weight: 600; background: #ffffff08; }
  .matchline { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .matchline .ln { color: #5a8bd8; margin-right: 6px; }

  /* Git 面板 */
  .section-head { display: flex; align-items: center; padding: 4px 10px; font-weight: 600; color: var(--dim); background: #ffffff06; }
  .section-head .act { margin-left: auto; color: var(--dim); cursor: pointer; padding: 0 4px; }
  .section-head .act:hover { color: var(--fg); }
  .gfile { display: flex; align-items: center; gap: 6px; padding: 2.5px 10px; cursor: pointer; }
  .gfile:hover { background: #ffffff0d; }
  .gfile .st { font-weight: 700; width: 12px; }
  .gfile .st.M { color: var(--mod); } .gfile .st.A { color: var(--add); } .gfile .st.U { color: var(--add); }
  .gfile .st.D { color: var(--del); } .gfile .st.R { color: var(--mod); } .gfile .st["?"], .gfile .st.q { color: var(--un); }
  .gfile .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .gfile .op { color: var(--dim); padding: 0 4px; border-radius: 4px; visibility: hidden; }
  .gfile:hover .op { visibility: visible; }
  .gfile .op:hover { color: #fff; background: #ffffff1c; }
  #commit-box { padding: 8px 10px; border-top: 1px solid var(--line); }
  #commit-msg { width: 100%; height: 54px; background: #141518; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: inherit; padding: 6px 8px; resize: vertical; outline: none; }
  #commit-msg:focus { border-color: var(--acc); }
  #commit-btn, .linkbtn { background: var(--acc); color: #fff; border: none; border-radius: 6px; padding: 5px 14px; font: inherit; cursor: pointer; margin-top: 6px; }
  #commit-btn:disabled { opacity: .45; cursor: default; }
  .btnrow { display: flex; gap: 6px; margin-top: 6px; }
  .linkbtn.secondary { background: #2c2e33; border: 1px solid var(--line); flex: 1; }
  #git-toast { padding: 6px 10px; font-size: 11px; color: var(--dim); word-break: break-all; }
  #git-toast.err { color: var(--del); }
  #git-toast.ok { color: var(--add); }
</style>
</head>
<body>
  <div id="panel">
    <div id="panel-head">
      <span class="title" id="head-title">工作区</span>
      <button class="btn" id="head-refresh" title="刷新"></button>
      <button class="btn" id="head-collapse" title="收起面板">»</button>
    </div>
    <div id="panel-body">
      <div id="view-files"></div>
      <div id="view-search" class="hidden">
        <div id="search-box">
          <input id="search-input" placeholder="搜索内容 / 文件名 / 目录名…（Enter）" />
          <button id="case-btn" title="区分大小写">Aa</button>
          <button id="word-btn" title="全字匹配">Wb</button>
          <button id="view-list-btn" class="viewtoggle active" title="列表视图"></button>
          <button id="view-tree-btn" class="viewtoggle" title="树视图"></button>
        </div>
        <div id="search-results"><div class="msg">输入关键词开始搜索</div></div>
      </div>
      <div id="view-git" class="hidden"></div>
    </div>
  </div>
  <div id="dragbar" title="拖拽调整宽度"></div>
  <div id="bar">
    <button class="tab active" id="tab-files" title="文件"></button>
    <button class="tab" id="tab-search" title="搜索"></button>
    <button class="tab" id="tab-git" title="Git"><span id="tab-git-icon"></span><span class="badge hidden" id="git-badge"></span></button>
    <div style="flex:1"></div>
    <button class="tab" id="bar-collapse" title="收起面板">»</button>
  </div>
<script src="./icons.gen.js"></script>
<script>
const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
const $ = (id) => document.getElementById(id);
const listen = window.__TAURI__.event.listen;

// ── 全局状态 ──
let wsInfo = null;          // workspace_info 结果
let gitMap = new Map();     // path -> status 字母（树装饰用）
let activeTab = "files";
let panelCollapsed = false;
const treeState = new Map(); // dirPath -> {open, children, loaded}
let ctxMenu = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// 渲染 DSH_ICONS（@ant-design/icons-svg 抽象树）为 SVG HTML。
function icon(name, cls) {
  const def = window.DSH_ICONS && window.DSH_ICONS[name];
  if (!def) return "";
  const { tag, attrs, children } = def.icon;
  const attrStr = Object.entries({ ...attrs, class: "anticon" + (cls ? " " + cls : "") })
    .map(([k, v]) => k + '="' + String(v).replace(/"/g, "&quot;") + '"').join(" ");
  const kids = (children || []).map((c) =>
    "<" + c.tag + Object.entries(c.attrs || {}).map(([k, v]) => " " + k + '="' + String(v).replace(/"/g, "&quot;") + '"').join("") + (c.children ? ">" + c.children.map((g) => "<" + g.tag + Object.entries(g.attrs || {}).map(([k, v]) => " " + k + '="' + String(v) + '"').join("") + "></" + g.tag + ">").join("") + "</" + c.tag + ">" : "></" + c.tag + ">")
  ).join("");
  return "<svg " + attrStr + " aria-hidden=\"true\">" + kids + "</svg>";
}

async function loadWorkspace() {
  try {
    wsInfo = await invoke("workspace_info");
  } catch (e) {
    $("head-title").textContent = "工作区不可用";
    $("view-files").innerHTML = '<div class="err">' + esc(e) + "</div>";
    return;
  }
  $("head-title").textContent = wsInfo.name;
  $("head-title").title = wsInfo.path;
  treeState.clear();
  treeState.set("", { open: true, loaded: false, children: null });
  await refreshGit();
  renderTree();
  if (activeTab === "git") renderGit();
}

async function refreshGit() {
  gitMap = new Map();
  const badge = $("git-badge");
  if (!wsInfo || !wsInfo.isGitRepo) { badge.classList.add("hidden"); return; }
  try {
    const st = await invoke("git_status");
    const all = st.staged.concat(st.unstaged);
    for (const c of all) {
      if (!gitMap.has(c.path) || gitMap.get(c.path) === " ") gitMap.set(c.path, c.status);
    }
    const n = all.length;
    badge.textContent = String(n);
    badge.classList.toggle("hidden", n === 0);
    window.__gitStatus = st;
  } catch (e) {
    badge.classList.add("hidden");
    window.__gitError = String(e);
  }
}

// ── 文件树 ──
async function ensureChildren(dirPath) {
  const node = treeState.get(dirPath);
  if (!node) return;
  if (node.loaded) return;
  try {
    const res = await invoke("fs_list", { dir: dirPath });
    node.children = res.items;
  } catch (e) {
    node.children = [];
    node.error = String(e);
  }
  node.loaded = true;
  for (const it of node.children || []) {
    if (it.kind === "dir" && !treeState.has(it.path)) {
      treeState.set(it.path, { open: false, loaded: false, children: null });
    }
  }
}

function gitMarkFor(relPath) {
  // gitMap 的 key 是相对路径（git_status 返回相对路径）
  return gitMap.get(relPath) || "";
}

function relOf(absPath) {
  if (!wsInfo) return absPath;
  const root = wsInfo.path.endsWith("/") ? wsInfo.path : wsInfo.path + "/";
  return absPath.startsWith(root) ? absPath.slice(root.length) : absPath;
}

function renderTree() {
  const host = $("view-files");
  if (!wsInfo) { host.innerHTML = ""; return; }
  host.innerHTML = "";
  const rootRow = document.createElement("div");
  rootRow.className = "row indent0";
  rootRow.innerHTML = '<span class="icon">' + icon("FolderOpenOutlined") + '</span><span class="name"><b>' + esc(wsInfo.name) + "</b></span>";
  host.appendChild(rootRow);
  const tree = document.createElement("div");
  tree.id = "tree-root";
  host.appendChild(tree);
  renderDirInto(tree, "");
}

function renderDirInto(container, dirPath) {
  const node = treeState.get(dirPath);
  if (!node || !node.loaded) {
    container.innerHTML = '<div class="msg">加载中…</div>';
    ensureChildren(dirPath).then(() => {
      if (dirPath === "") renderTree();
      else {
        // 找到该目录行后的子容器重新渲染
        const sub = document.getElementById("kids-" + cssId(dirPath));
        if (sub) renderDirInto(sub, dirPath);
      }
    });
    return;
  }
  container.innerHTML = "";
  if (node.error) {
    container.innerHTML = '<div class="err">' + esc(node.error) + "</div>";
    return;
  }
  const depth = dirPath === "" ? 1 : dirPath.split("/").length + 1;
  // 注意：abs 路径分隔符是 /（macOS/Windows webview 端统一用 / 展示，Rust 端接受系统分隔符）
  for (const item of node.children || []) {
    const row = document.createElement("div");
    const d = Math.min(depth, 6);
    row.className = "row indent" + d;
    const mark = item.kind === "file" ? gitMarkFor(item.path) : "";
    const markHtml = mark ? '<span class="gitmark ' + esc(mark) + '">' + esc(mark) + "</span>" : "";
    const caret = item.kind === "dir" ? '<span class="caret">' + (treeState.get(item.path)?.open ? icon("CaretDownOutlined") : icon("CaretRightOutlined")) + "</span>" : '<span class="caret"></span>';
    const fileIcon = item.kind === "dir" ? icon("FolderOutlined") : icon("FileOutlined");
    row.innerHTML = caret + '<span class="icon">' + fileIcon + '</span><span class="name">' + esc(item.name) + "</span>" + markHtml;
    row.dataset.path = item.path;
    row.dataset.kind = item.kind;
    row.dataset.name = item.name;
    row.addEventListener("click", () => onTreeClick(item, treeState.get(item.path)));
    row.addEventListener("contextmenu", (ev) => { ev.preventDefault(); showCtx(ev, item); });
    container.appendChild(row);
    if (item.kind === "dir") {
      const kids = document.createElement("div");
      kids.id = "kids-" + cssId(item.path);
      if (!treeState.get(item.path)?.open) kids.classList.add("hidden");
      container.appendChild(kids);
      if (treeState.get(item.path)?.open) renderDirInto(kids, item.path);
    }
  }
  if ((node.children || []).length === 0) {
    container.innerHTML = '<div class="msg">（空目录）</div>';
  }
}

function cssId(p) { return p.replace(/[^a-zA-Z0-9]/g, "_") || "root"; }

async function onTreeClick(item, node) {
  if (item.kind === "dir") {
    node.open = !node.open;
    if (node.open) await ensureChildren(item.path);
    renderTree();
  } else {
    openViewer({ path: item.path, name: item.name });
  }
}

// ── 右键菜单 ──
function closeCtx() { if (ctxMenu) { ctxMenu.remove(); ctxMenu = null; } }
document.addEventListener("click", closeCtx);

function showCtx(ev, item) {
  closeCtx();
  const menu = document.createElement("div");
  menu.style.cssText = "position:fixed;z-index:99;background:#2a2b2f;border:1px solid var(--line);border-radius:8px;padding:4px;min-width:160px;box-shadow:0 8px 24px #0009;";
  const mk = (label, fn, danger) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.style.cssText = "display:block;width:100%;text-align:left;background:none;border:none;color:" + (danger ? "var(--del)" : "var(--fg)") + ";font:inherit;padding:5px 10px;border-radius:5px;cursor:pointer;";
    b.onmouseenter = () => (b.style.background = "#ffffff14");
    b.onmouseleave = () => (b.style.background = "none");
    b.onclick = () => { closeCtx(); fn(); };
    menu.appendChild(b);
  };
  const dir = item.kind === "dir" ? item.path : parentOf(item.path);
  if (item.kind === "file") {
    mk("打开", () => openViewer({ path: item.path, name: item.name }));
    mk("在访达中显示", () => invoke("fs_reveal", { path: item.path }).catch(alertErr));
    mk("复制路径", () => invoke("fs_copy_path", { path: item.path }).catch(alertErr));
    menu.appendChild(sep());
  }
  mk("新建文件", () => promptName("新建文件", "", (name) =>
    invoke("fs_new_file", { dir, name }).then(refreshAll).catch(alertErr)));
  mk("新建文件夹", () => promptName("新建文件夹", "", (name) =>
    invoke("fs_mkdir", { dir, name }).then(refreshAll).catch(alertErr)));
  menu.appendChild(sep());
  mk("重命名", () => promptName("重命名", item.name, (name) =>
    invoke("fs_rename", { path: item.path, new_name: name }).then(refreshAll).catch(alertErr)));
  mk("删除", () => {
    if (confirm("确定删除 " + item.name + " ？此操作不可撤销。")) {
      invoke("fs_delete", { path: item.path }).then(refreshAll).catch(alertErr);
    }
  }, true);
  menu.style.left = Math.min(ev.clientX, window.innerWidth - 180) + "px";
  menu.style.top = Math.min(ev.clientY, window.innerHeight - 240) + "px";
  document.body.appendChild(menu);
  ctxMenu = menu;
}

function sep() { const d = document.createElement("div"); d.style.cssText = "height:1px;background:var(--line);margin:4px 6px;"; return d; }

function parentOf(p) {
  const i = p.lastIndexOf("/");
  return i <= 0 ? "" : p.slice(0, i);
}

function promptName(title, initial, cb) {
  const v = prompt(title, initial);
  if (v === null) return;
  const t = v.trim();
  if (!t) return;
  cb(t);
}

function alertErr(e) { alert(String(e)); }

async function refreshAll() {
  // 清空已加载缓存，重载当前展开目录
  for (const [k, node] of treeState) { node.loaded = false; node.children = null; node.error = null; }
  await refreshGit();
  renderTree();
  if (activeTab === "git") renderGit();
}

// ── viewer 调起 ──
async function openViewer(opts) {
  invoke("open_viewer", { path: opts.path || "", line: opts.line || 0, mode: opts.mode || "text" }).catch(alertErr);
}


// ── 搜索面板 ──
let caseSensitive = false;
let wholeWord = false;
$("case-btn").onclick = () => {
  caseSensitive = !caseSensitive;
  $("case-btn").classList.toggle("on", caseSensitive);
};
$("word-btn").onclick = () => {
  wholeWord = !wholeWord;
  $("word-btn").classList.toggle("on", wholeWord);
};
$("search-input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") runSearch();
});
let searchOut = null;   // 最近一次 SearchOutcome
let searchQuery = "";   // 最近一次关键词
let searchView = "list"; // "list" | "tree"

async function runSearch() {
  const q = $("search-input").value.trim();
  const host = $("search-results");
  if (!q) { host.innerHTML = '<div class="msg">输入关键词开始搜索</div>'; return; }
  host.innerHTML = '<div class="msg">搜索中…</div>';
  try {
    const t0 = performance.now();
    const out = await invoke("search_workspace", { query: q, caseSensitive, wholeWord });
    searchOut = out; searchQuery = q;
    renderSearch(performance.now() - t0);
  } catch (e) {
    host.innerHTML = '<div class="err">' + esc(e) + "</div>";
  }
}

function openPath(rel, line) {
  const root = wsInfo ? wsInfo.path : "";
  const sep_ = root && !root.endsWith("/") ? "/" : "";
  invoke("open_viewer", { path: root + sep_ + rel, line: line || 0, mode: "text" });
}

function renderSearch(ms) {
  const host = $("search-results");
  host.innerHTML = "";
  if (!searchOut) return;
  const { matches, paths, truncated } = searchOut;
  if (matches.length === 0 && paths.length === 0) {
    host.innerHTML = '<div class="msg">无结果</div>';
    return;
  }
  const byFile = new Map();
  for (const m of matches) {
    if (!byFile.has(m.file)) byFile.set(m.file, []);
    byFile.get(m.file).push(m);
  }
  const parts = [];
  if (paths.length) parts.push(paths.length + " 个文件/目录");
  if (matches.length) parts.push(byFile.size + " 个文件中 " + matches.length + " 处内容");
  const stats = document.createElement("div");
  stats.className = "msg";
  stats.textContent = parts.join(" · ") + " · " + (ms / 1000).toFixed(2) + "s" + (truncated ? " · 已截断" : "");
  host.appendChild(stats);

  // 统一集合：path -> { kind, hits }（路径命中与内容命中合并，不做分类分组）
  const unified = new Map();
  for (const ph of paths) unified.set(ph.path, { kind: ph.kind, hits: [] });
  for (const [file, list] of byFile) {
    const ex = unified.get(file);
    if (ex) ex.hits = list;
    else unified.set(file, { kind: "file", hits: list });
  }
  const sorted = [...unified.entries()].sort((a, b) => a[0].localeCompare(b[0]));

  if (searchView === "tree") renderUnifiedTree(host, sorted);
  else renderUnifiedList(host, sorted);
}

// 列表平铺：单一流，按路径排序；目录一行，文件头 + 内容行。
function renderUnifiedList(host, sorted) {
  for (const [path, info] of sorted) {
    if (info.kind === "dir") {
      const row = document.createElement("div");
      row.className = "path-hit";
      row.innerHTML = icon("FolderOutlined") + ' <span>' + highlight(path, searchQuery, caseSensitive) + '</span> <span class="pkind">目录</span>';
      row.addEventListener("click", () => { switchTab("files"); expandTo(path); });
      host.appendChild(row);
      continue;
    }
    const gh = document.createElement("div");
    gh.className = "filegroup-head";
    gh.innerHTML = icon("FileOutlined") + ' ' + highlight(path, searchQuery, caseSensitive) + (info.hits.length ? ' <span style="color:var(--dim)">(' + info.hits.length + ")</span>" : "");
    host.appendChild(gh);
    for (const m of info.hits) appendMatchRow(host, path, m, 22);
  }
}

// 树视图：统一集合构建成嵌套树；空目录（仅路径命中）也渲染，文件节点下挂内容行。
function renderUnifiedTree(host, sorted) {
  const root = { dirs: new Map(), files: new Map() };
  const ensureDir = (node, seg) => {
    if (!node.dirs.has(seg)) node.dirs.set(seg, { dirs: new Map(), files: new Map(), hit: false });
    return node.dirs.get(seg);
  };
  for (const [path, info] of sorted) {
    const segs = path.split("/");
    let node = root;
    for (let i = 0; i < segs.length - 1; i++) node = ensureDir(node, segs[i]);
    const name = segs[segs.length - 1];
    if (info.kind === "dir") ensureDir(node, name).hit = true;
    else node.files.set(name, info);
  }
  const renderNode = (node, prefix, depth, host) => {
    for (const [name, child] of [...node.dirs.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
      const count = subtreeCount(child);
      const full = prefix + name;
      const line = document.createElement("div");
      line.className = "tree-line";
      line.style.paddingLeft = 8 + depth * 18 + "px";
      line.innerHTML = '<span class="tw">' + icon("CaretDownOutlined") + '</span>' + icon("FolderOutlined") + ' <span>' + highlight(name, searchQuery, caseSensitive) + '</span>' + (count ? '<span class="cnt">(' + count + ")</span>" : "");
      const box = document.createElement("div");
      line.addEventListener("click", () => {
        const open = box.style.display !== "none";
        box.style.display = open ? "none" : "";
        line.querySelector(".tw").innerHTML = open ? icon("CaretDownOutlined") : icon("CaretRightOutlined");
      });
      host.appendChild(line);
      host.appendChild(box);
      renderNode(child, full + "/", depth + 1, box);
    }
    for (const [name, info] of [...node.files.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
      const rel = prefix + name;
      const fl = document.createElement("div");
      fl.className = "tree-line";
      fl.style.paddingLeft = 8 + depth * 18 + "px";
      fl.innerHTML = '<span class="tw"></span>' + icon("FileOutlined") + ' <span>' + highlight(name, searchQuery, caseSensitive) + '</span>' + (info.hits.length ? '<span class="cnt">(' + info.hits.length + ")</span>" : "");
      fl.addEventListener("click", () => openPath(rel, info.hits[0] ? info.hits[0].line : 0));
      host.appendChild(fl);
      for (const m of info.hits) {
        const mr = document.createElement("div");
        mr.className = "tree-match";
        mr.innerHTML = '<span class="ln" style="color:#5a8bd8;margin-right:6px">' + m.line + '</span>' + highlight(m.preview, searchQuery, caseSensitive);
        mr.addEventListener("click", (ev) => { ev.stopPropagation(); openPath(rel, m.line); });
        host.appendChild(mr);
      }
    }
  };
  renderNode(root, "", 0, host);
}

function appendMatchRow(host, file, m, pad) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<span class="matchline"><span class="ln">' + m.line + '</span>' + highlight(m.preview, searchQuery, caseSensitive) + "</span>";
  row.style.paddingLeft = pad + "px";
  row.addEventListener("click", () => openPath(file, m.line));
  host.appendChild(row);
}

function subtreeCount(node) {
  let n = 0;
  for (const [, list] of node.files) n += list.length;
  for (const [, child] of node.dirs) n += subtreeCount(child);
  return n;
}

// 展开文件树到指定相对路径（路径命中-目录点击时用）。
async function expandTo(rel) {
  const segs = rel.split("/").filter(Boolean);
  treeState.clear();
  treeState.set("", { open: true, loaded: false, children: null });
  let acc = "";
  for (const seg of segs) {
    acc = acc ? acc + "/" + seg : seg;
    treeState.set(acc, { open: true, loaded: false, children: null });
  }
  await renderTree();
}

// 视图切换按钮
$("view-list-btn").onclick = () => { searchView = "list"; $("view-list-btn").classList.add("active"); $("view-tree-btn").classList.remove("active"); if (searchOut) renderSearch(0); };
$("view-tree-btn").onclick = () => { searchView = "tree"; $("view-tree-btn").classList.add("active"); $("view-list-btn").classList.remove("active"); if (searchOut) renderSearch(0); };
function highlight(text, q, cs) {
  const t = esc(text);
  const needle = esc(q);
  const escRe = needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const flags = cs ? "g" : "gi";
  const re = new RegExp(wholeWord ? "(?<![#\\w])" + escRe + "(?![#\\w])" : escRe, flags);
  return t.replace(re, (m) => '<span class="mark">' + m + "</span>");
}

// ── Git 面板 ──
async function renderGit() {
  const host = $("view-git");
  if (!wsInfo) { host.innerHTML = ""; return; }
  if (!wsInfo.isGitRepo) {
    host.innerHTML = '<div class="msg">当前目录不是 git 仓库。</div><div style="padding:10px"><button id="git-init-btn" class="linkbtn">初始化仓库</button></div><div id="git-toast"></div>';
    $("git-init-btn").onclick = async () => {
      try {
        await invoke("git_init");
        toast("已初始化 git 仓库", "ok");
        await refreshAll();
      } catch (e) { toast(String(e), "err"); }
    };
    return;
  }
  if (wsInfo.gitMissing) {
    host.innerHTML = '<div class="msg">未检测到 git 命令。<br>macOS: xcode-select --install<br>Windows: 安装 Git for Windows</div>';
    return;
  }
  let st;
  try {
    st = await invoke("git_status");
  } catch (e) {
    host.innerHTML = '<div class="err">' + esc(e) + "</div>";
    return;
  }
  host.innerHTML = "";
  const head = document.createElement("div");
  head.className = "section-head";
  head.innerHTML = icon("BranchesOutlined") + " " + esc(st.branch) +
    (st.ahead || st.behind ? " <span style=\"color:var(--dim)\">↑" + st.ahead + " ↓" + st.behind + "</span>" : "");
  host.appendChild(head);
  const sec = (title, files, ops) => {
    if (!files.length) return;
    const sh = document.createElement("div");
    sh.className = "section-head";
    sh.innerHTML = esc(title);
    for (const [label, fn] of ops.all || []) {
      const a = document.createElement("span");
      a.className = "act";
      a.textContent = label;
      a.onclick = fn;
      sh.appendChild(a);
    }
    host.appendChild(sh);
    for (const f of files) {
      const row = document.createElement("div");
      row.className = "gfile";
      const stCls = f.status === "?" ? "q" : f.status;
      let html = '<span class="st ' + stCls + '">' + esc(f.status) + '</span><span class="name" title="' + esc(f.path) + '">' + esc(f.path) + "</span>";
      for (const [label, fn, danger] of ops.each) {
        const cls = danger ? "op danger" : "op";
        html += '<span class="' + cls + '" data-op="' + label + '">' + label + "</span>";
      }
      row.innerHTML = html;
      row.addEventListener("click", (ev) => {
        if (ev.target.classList.contains("op")) return;
        const mode = f.staged ? "diff-staged" : "diff";
        invoke("open_viewer", { path: f.path, mode });
      });
      row.querySelectorAll(".op").forEach((el) => {
        el.addEventListener("click", (ev) => {
          ev.stopPropagation();
          ops.each.find(([label]) => label === el.dataset.op)[1](f);
        });
      });
      host.appendChild(row);
    }
  };
  sec("已暂存", st.staged, {
    all: [["全部取消", () => act("git_unstage", st.staged.map((f) => f.path))]],
    each: [["−", (f) => act("git_unstage", [f.path])]],
  });
  sec("更改", st.unstaged, {
    all: [["全部暂存", () => act("git_add", st.unstaged.map((f) => f.path))]],
    each: [
      ["+", (f) => act("git_add", [f.path])],
      ["↩", (f) => {
        if (confirm("放弃 " + f.path + " 的全部更改？此操作不可撤销。")) act("git_discard", [f.path]);
      }, true],
    ],
  });
  if (!st.staged.length && !st.unstaged.length) {
    const clean = document.createElement("div");
    clean.className = "msg";
    clean.textContent = "工作区干净，没有更改。";
    host.appendChild(clean);
  }
  const box = document.createElement("div");
  box.id = "commit-box";
  box.innerHTML =
    '<textarea id="commit-msg" placeholder="提交信息（⌘Enter 提交）"></textarea>' +
    '<button id="commit-btn"' + (st.staged.length ? "" : " disabled") + '>✓ 提交</button>' +
    '<div class="btnrow"><button class="linkbtn secondary" id="pull-btn">拉取</button><button class="linkbtn secondary" id="push-btn">推送</button></div>' +
    '<div id="git-toast"></div>';
  host.appendChild(box);
  $("commit-btn").onclick = async () => {
    const msg = $("commit-msg").value.trim();
    if (!msg) return;
    try {
      await invoke("git_commit", { message: msg });
      toast("已提交：" + msg, "ok");
      await refreshAll();
    } catch (e) { toast(String(e), "err"); }
  };
  $("commit-msg").addEventListener("keydown", (ev) => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter") $("commit-btn").click();
  });
  $("push-btn").onclick = () => act("git_push");
  $("pull-btn").onclick = () => act("git_pull");
  buildBranchPanel(host, st.branch);
  buildHistoryPanel(host);
  const ib = $("git-init-btn");
  if (ib) ib.onclick = async () => {
    try {
      await invoke("git_init");
      toast("已初始化 git 仓库", "ok");
      await refreshAll();
    } catch (e) { toast(String(e), "err"); }
  };
}
// 分支面板：head 行点击展开，本地/远程分组，可切换/新建。
async function buildBranchPanel(host, current) {
  const row = document.createElement("div");
  row.className = "branch-head";
  row.innerHTML = '<span class="branch-name">' + esc(current) + '<span class="caret">' + icon("CaretDownOutlined") + "</span></span><span class=\"act\">切换分支</span>";
  host.appendChild(row);
  const box = document.createElement("div");
  box.style.display = "none";
  host.appendChild(box);
  row.addEventListener("click", async () => {
    if (box.style.display === "none") {
      box.style.display = "";
      if (!box.dataset.loaded) {
        box.dataset.loaded = "1";
        await loadBranchList(box, current);
      }
    } else box.style.display = "none";
  });
}

async function loadBranchList(box, current) {
  box.innerHTML = '<div class="msg">加载中…</div>';
  let branches;
  try { branches = await invoke("git_branches"); } catch (e) { box.innerHTML = '<div class="err">' + esc(e) + "</div>"; return; }
  box.innerHTML = "";
  const newBox = document.createElement("div");
  newBox.className = "newbranch-box";
  newBox.innerHTML = '<input id="new-branch-input" placeholder="新分支名…" />';
  const btn = document.createElement("button");
  btn.className = "linkbtn";
  btn.textContent = "新建并切换";
  btn.onclick = async () => {
    const name = newBox.querySelector("input").value.trim();
    if (!name) return;
    try { await invoke("git_checkout", { branch: name, newBranch: true }); toast("已创建并切换到 " + name, "ok"); await refreshAll(); } catch (e) { toast(String(e), "err"); }
  };
  newBox.appendChild(btn);
  box.appendChild(newBox);
  newBox.querySelector("input").addEventListener("keydown", (ev) => { if (ev.key === "Enter") btn.click(); });
  for (const kind of ["local", "remote"]) {
    const list = branches.filter((b) => b.kind === kind);
    if (!list.length) continue;
    const sh = document.createElement("div");
    sh.className = "section-head";
    sh.textContent = kind === "local" ? "本地分支" : "远程分支";
    box.appendChild(sh);
    for (const b of list) {
      const row = document.createElement("div");
      row.className = "branch-row" + (b.current ? " current" : "");
      row.innerHTML = icon(b.current ? "CaretRightOutlined" : "BranchesOutlined") + ' <span>' + esc(b.name) + "</span>" + (b.upstream ? ' <span class="pkind">' + esc(b.upstream) + "</span>" : "");
      if (!b.current) row.addEventListener("click", async () => {
        try { await invoke("git_checkout", { branch: b.name, newBranch: false }); toast("已切换到 " + b.name, "ok"); await refreshAll(); } catch (e) { toast(String(e), "err"); }
      });
      box.appendChild(row);
    }
  }
}

// 历史面板：按钮展开/收起，条目点击展开文件列表，文件点击查看该提交 diff。
async function buildHistoryPanel(host) {
  const sh = document.createElement("div");
  sh.className = "section-head";
  sh.innerHTML = icon("HistoryOutlined") + " <span>提交历史</span>";
  sh.style.cursor = "pointer";
  host.appendChild(sh);
  const box = document.createElement("div");
  box.style.display = "none";
  host.appendChild(box);
  sh.addEventListener("click", async () => {
    if (box.style.display === "none") {
      box.style.display = "";
      if (!box.dataset.loaded) { box.dataset.loaded = "1"; await loadHistory(box); }
    } else box.style.display = "none";
  });
}

async function loadHistory(box) {
  box.innerHTML = '<div class="msg">加载中…</div>';
  let commits;
  try { commits = await invoke("git_log", { max: 50 }); } catch (e) { box.innerHTML = '<div class="err">' + esc(e) + "</div>"; return; }
  box.innerHTML = "";
  if (!commits.length) { box.innerHTML = '<div class="msg">暂无提交</div>'; return; }
  for (const c of commits) {
    const item = document.createElement("div");
    item.className = "commit-item";
    const date = new Date(c.time * 1000);
    const dateStr = date.getMonth() + 1 + "/" + date.getDate() + " " + String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");
    item.innerHTML = '<div class="commit-head"><span class="cshort">' + esc(c.short) + '</span><span class="csubj">' + esc(c.subject) + '</span></div><div class="cmeta">' + esc(c.author) + " · " + dateStr + (c.refs ? " · " + esc(c.refs) : "") + "</div>";
    const files = document.createElement("div");
    files.className = "commit-files hidden";
    item.appendChild(files);
    item.querySelector(".commit-head").addEventListener("click", async () => {
      if (files.classList.contains("hidden")) {
        files.classList.remove("hidden");
        if (!files.dataset.loaded) {
          files.dataset.loaded = "1";
          let fl;
          try { fl = await invoke("git_commit_files", { hash: c.hash }); } catch (e) { files.innerHTML = '<div class="err">' + esc(e) + "</div>"; return; }
          files.innerHTML = "";
          for (const f of fl) {
            const fr = document.createElement("div");
            fr.className = "commit-file";
            fr.innerHTML = '<span class="st">' + esc(f.status) + '</span><span>' + esc(f.path) + "</span>";
            fr.addEventListener("click", async () => {
              try {
                const diff = await invoke("git_commit_diff", { hash: c.hash });
                invoke("open_viewer", { path: f.path, mode: "text", content: diff });
              } catch (e) { toast(String(e), "err"); }
            });
            files.appendChild(fr);
          }
        }
      } else files.classList.add("hidden");
    });
    box.appendChild(item);
  }
}


function toast(text, cls) {
  const el = $("git-toast");
  if (!el) return;
  el.className = cls || "";
  el.textContent = text;
}
async function act(cmd, paths) {
  try {
    await invoke(cmd, paths === undefined ? {} : { paths });
    if (cmd !== "git_push" && cmd !== "git_pull") toast("完成：" + cmd, "ok");
    else toast(cmd === "git_push" ? "已推送" : "已拉取", "ok");
    await refreshAll();
  } catch (e) {
    toast(String(e), "err");
  }
}

// ── Tab 切换 / 刷新 / 折叠 ──
const VIEWS = { files: "view-files", search: "view-search", git: "view-git" };
const TITLES = { files: null, search: "搜索", git: "Git" };
function switchTab(name) {
  activeTab = name;
  for (const [k, id] of Object.entries(VIEWS)) {
    $(id).classList.toggle("hidden", k !== name);
    $("tab-" + k).classList.toggle("active", k === name);
  }
  if (name === "git") renderGit();
  if (name === "search") setTimeout(() => $("search-input").focus(), 50);
}
// tab 图标点击：切面板；再次点击已激活图标 → 收起面板；收起状态点击 → 展开并切换。
async function onTabClick(name) {
  if (panelCollapsed) {
    switchTab(name);
    try { applyCollapse(await invoke("toggle_sidebar")); } catch (e) { alert(String(e)); }
    return;
  }
  if (activeTab === name) {
    // 已激活：收起（保留激活态高亮）
    try { applyCollapse(await invoke("toggle_sidebar")); } catch (e) { alert(String(e)); }
    return;
  }
  switchTab(name);
}
$("tab-files").onclick = () => onTabClick("files");
$("tab-search").onclick = () => onTabClick("search");
$("tab-git").onclick = () => onTabClick("git");
$("head-refresh").onclick = async () => {
  if (activeTab === "files") await refreshAll();
  else if (activeTab === "git") { await refreshAll(); }
  else if (activeTab === "search") await runSearch();
};
async function doCollapse() {
  try {
    const hidden = await invoke("toggle_sidebar");
    applyCollapse(hidden);
  } catch (e) { alert(String(e)); }
}
function applyCollapse(hidden) {
  panelCollapsed = hidden;
  $("panel").classList.toggle("collapsed", hidden);
  $("dragbar").style.display = hidden ? "none" : "";
  const glyph = hidden ? "«" : "»";
  $("bar-collapse").textContent = glyph;
  $("head-collapse").textContent = glyph;
}
$("bar-collapse").onclick = doCollapse;
$("head-collapse").onclick = doCollapse;

// 拖拽调宽：dragbar 在面板与竖条之间，clientX 即目标面板宽
$("dragbar").addEventListener("mousedown", (ev) => {
  ev.preventDefault();
  const move = (e) => invoke("set_sidebar_width", { width: e.clientX });
  const up = () => {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
});

// 宽度自适应折叠态（⌘B 菜单/其他入口触发布局变化时同步 UI）
new ResizeObserver(() => {
  const collapsed = document.body.clientWidth <= 60;
  if (collapsed !== panelCollapsed) applyCollapse(collapsed);
}).observe(document.body);

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { closeCtx(); return; }
  // ⌘1/⌘2/⌘3 切换文件/搜索/Git 面板；⌘F 聚焦搜索框。
  if (!(ev.metaKey || ev.ctrlKey)) return;
  if (ev.key === "1") { switchTab("files"); ev.preventDefault(); }
  else if (ev.key === "2") { switchTab("search"); ev.preventDefault(); }
  else if (ev.key === "3") { switchTab("git"); ev.preventDefault(); }
  else if (ev.key === "f" || ev.key === "F") {
    switchTab("search");
    requestAnimationFrame(() => $("search-input").focus());
    ev.preventDefault();
  }
});

// ── 静态图标 ──
$("tab-files").innerHTML = icon("BarsOutlined");
$("tab-search").innerHTML = icon("SearchOutlined");
$("tab-git-icon").innerHTML = icon("BranchesOutlined");
$("head-refresh").innerHTML = icon("ReloadOutlined");
$("view-list-btn").innerHTML = icon("BarsOutlined");
$("view-tree-btn").innerHTML = icon("ApartmentOutlined");

// ── 启动 ──
listen("dsh-sidebar-workspace", () => loadWorkspace());
loadWorkspace();
