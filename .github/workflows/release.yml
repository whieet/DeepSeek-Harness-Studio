name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 同 ref 新 run 触发时自动取消旧 run（避免强移 tag 后新旧并行白烧机器）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-15-intel    # Intel：bundle_dmg.sh 在该镜像上会挂起 30 分钟，改产 .app + zip
            target: x86_64-apple-darwin
            bundles: app
            artifact: dist/*.zip
          - os: windows-latest    # Windows x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Rust 增量缓存：按 target 分键，二次构建 10 分钟 → ~2 分钟
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # 运行时闭包缓存（Node 侧车 + npm 闭包）：键含 stage 脚本哈希，命中则跳过整个 stage
      - name: 缓存运行时（Node 侧车 + dsh 闭包）
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries/dsh-node-*
            src-tauri/resources/dsh
          key: dsh-runtime-${{ matrix.target }}-${{ hashFiles('scripts/stage-runtime.mjs') }}

      - name: 打包运行时（缓存未命中才执行）
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: node scripts/stage-runtime.mjs

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（${{ matrix.target }}）
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 收集产物（Intel：zip .app；dmg/nsis 直接收集）
        shell: bash
        run: |
          set -e
          mkdir -p "${{ github.workspace }}/dist"
          BUNDLE_DIR="${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/bundle"
          APP_DIR="${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ZIP_OUT="${{ github.workspace }}/dist/DeepSeek.Harness_${{ github.ref_name }}_${{ matrix.target }}.app.zip"
          if [ "${{ matrix.bundles }}" = "app" ]; then
            test -d "$APP_DIR/DeepSeek Harness.app"
            zip -qry "$ZIP_OUT" "$APP_DIR/DeepSeek Harness.app"
          else
            cp ${{ matrix.artifact }} "${{ github.workspace }}/dist/"
          fi
          ls -la "${{ github.workspace }}/dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
