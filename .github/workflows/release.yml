# 发布流水线：基于 Tauri 官方文档（https://v2.tauri.app/distribute/pipelines/github/）
# 触发：push 到 release 分支 / 手动 dispatch。构建、创建 tag、上传 release 均由 tauri-action 完成。
#
# 与官方示例的两处差异及理由：
#   1. Intel 用 macos-15-intel（真 x64 runner）而非 macos-latest 交叉编译——
#      运行时闭包含 @vscode/ripgrep-darwin-x64 等按平台分发的原生依赖，
#      npm 只安装当前机器架构的版本，arm64 上交叉拿不到 x64 闭包。
#   2. Intel 产 .app（--bundles app）而非 dmg——
#      macos-15-intel 镜像上 bundle_dmg.sh 会挂起（实测 30 分钟），tauri-action 原生支持上传 .app。
#
# 另比官方示例多「打包运行时」步骤（下载 Node 侧车 + 安装 dsh 闭包），为本项目架构所需。

name: release

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest    # Apple Silicon（M1 及以上）
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-15-intel  # Intel x64（真 x64 runner，理由见文件头）
            target: x86_64-apple-darwin
            bundles: app
          - platform: windows-latest  # Windows x64
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含目标三元组）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Rust 增量缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 运行时缓存（Node 侧车 + dsh 闭包）
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries/dsh-node-*
            src-tauri/resources/dsh
          key: dsh-runtime-${{ matrix.target }}-${{ hashFiles('scripts/stage-runtime.mjs') }}

      - name: 打包运行时（缓存未命中才执行）
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: node scripts/stage-runtime.mjs

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DeepSeek Harness v__VERSION__'
          releaseBody: '下载对应平台的安装包使用。'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
